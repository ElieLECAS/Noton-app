  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
  MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
  MISTRAL_OCR_TIMEOUT: ${MISTRAL_OCR_TIMEOUT:-300}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  MODEL_FAST: ${MODEL_FAST:-mistral-small-latest}
  MAX_COMPLETION_TOKENS: ${MAX_COMPLETION_TOKENS:-1024}
  SPACE_CHAT_MAX_TOKENS: ${SPACE_CHAT_MAX_TOKENS:-2048}
  SPACE_CHAT_TEMPERATURE: ${SPACE_CHAT_TEMPERATURE:-0.55}
  SPACE_CHAT_TOP_P: ${SPACE_CHAT_TOP_P:-}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mistral-embed}
  HIERARCHICAL_CHUNK_SIZES: ${HIERARCHICAL_CHUNK_SIZES:-1024,256}
  USE_MARKDOWN_STRUCTURED_CHUNKING: ${USE_MARKDOWN_STRUCTURED_CHUNKING:-false}
  PDF_FORCE_OCR: ${PDF_FORCE_OCR:-false}
  MARKDOWN_STRUCTURED_PARENT_DEPTH: ${MARKDOWN_STRUCTURED_PARENT_DEPTH:-1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  RAG_TOP_K: ${RAG_TOP_K:-8}
  # Budget contexte génération relevé pour la fenêtre 256k (plusieurs pages entières).
  SPACE_CONTEXT_MAX_PASSAGE_CHARS: ${SPACE_CONTEXT_MAX_PASSAGE_CHARS:-12000}
  SPACE_CONTEXT_MAX_CHARS: ${SPACE_CONTEXT_MAX_CHARS:-80000}
  SPACE_HISTORY_MAX_CHARS: ${SPACE_HISTORY_MAX_CHARS:-16000}
  RAG_RENDER_ALL_IMAGES: ${RAG_RENDER_ALL_IMAGES:-true}
  RAG_MAX_IMAGES: ${RAG_MAX_IMAGES:-12}
  MIN_VECTOR_SIMILARITY: ${MIN_VECTOR_SIMILARITY:-0.25}
  COLPALI_MIN_THRESHOLD: ${COLPALI_MIN_THRESHOLD:-0.30}
  COLPALI_RELATIVE_MARGIN: ${COLPALI_RELATIVE_MARGIN:-0.18}
  VISION_RERANK_ENABLED: ${VISION_RERANK_ENABLED:-true}
  VISION_RERANK_MODEL: ${VISION_RERANK_MODEL:-mistral-small-latest}
  VISION_RERANK_MIN_SCORE: ${VISION_RERANK_MIN_SCORE:-3}
  VISION_RERANK_MAX_PAGES: ${VISION_RERANK_MAX_PAGES:-4}
  VISION_RERANK_DPI: ${VISION_RERANK_DPI:-150}
  FAQ_TOP_K: ${FAQ_TOP_K:-3}
  FAQ_MIN_SIMILARITY: ${FAQ_MIN_SIMILARITY:-0.30}
  FAQ_POST_DRAFT_ENABLED: ${FAQ_POST_DRAFT_ENABLED:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
  MULTIMODAL_PAGE_CONCURRENCY: ${MULTIMODAL_PAGE_CONCURRENCY:-3}
  TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-celery}
  KAG_ENABLED: ${KAG_ENABLED:-true}
  KAG_EXTRACTION_MODEL: ${KAG_EXTRACTION_MODEL:-mistral-small-latest}
  KAG_EXTRACTION_CONCURRENCY: ${KAG_EXTRACTION_CONCURRENCY:-3}
  KAG_EXTRACTION_TIMEOUT: ${KAG_EXTRACTION_TIMEOUT:-120}
  KAG_EXTRACTION_MAX_TOKENS: ${KAG_EXTRACTION_MAX_TOKENS:-4096}
  KAG_MAX_ENTITIES_PER_PAGE: ${KAG_MAX_ENTITIES_PER_PAGE:-20}
  KAG_MAX_RELATIONS_PER_PAGE: ${KAG_MAX_RELATIONS_PER_PAGE:-15}
  KAG_SMALL_MODEL_MAX_ENTITIES: ${KAG_SMALL_MODEL_MAX_ENTITIES:-8}
  KAG_SMALL_MODEL_MAX_RELATIONS: ${KAG_SMALL_MODEL_MAX_RELATIONS:-6}
  KAG_RETRIEVAL_HOP_LIMIT: ${KAG_RETRIEVAL_HOP_LIMIT:-1}
  KAG_ENTITY_MATCH_MIN_SCORE: ${KAG_ENTITY_MATCH_MIN_SCORE:-0.35}
  # Extraction KAG par fenêtre glissante (entités + catégories, 3 PNG par appel)
  KAG_BATCH_SIZE: ${KAG_BATCH_SIZE:-3}
  KAG_BATCH_OVERLAP: ${KAG_BATCH_OVERLAP:-1}
  # Enrichissement contextuel inter-pages (synthèse factuelle par thème/catégorie)
  CONTEXTUAL_ENRICHMENT_ENABLED: ${CONTEXTUAL_ENRICHMENT_ENABLED:-true}
  CONTEXTUAL_ENRICHMENT_MODEL: ${CONTEXTUAL_ENRICHMENT_MODEL:-mistral-small-latest}
  CONTEXTUAL_ENRICHMENT_MAX_TOKENS: ${CONTEXTUAL_ENRICHMENT_MAX_TOKENS:-1500}
  CONTEXTUAL_ENRICHMENT_CONCURRENCY: ${CONTEXTUAL_ENRICHMENT_CONCURRENCY:-2}
  CONTEXTUAL_ENRICHMENT_TIMEOUT: ${CONTEXTUAL_ENRICHMENT_TIMEOUT:-90}
  CONTEXTUAL_ENRICHMENT_BATCH_SIZE: ${CONTEXTUAL_ENRICHMENT_BATCH_SIZE:-3}
  CONTEXTUAL_ENRICHMENT_BATCH_OVERLAP: ${CONTEXTUAL_ENRICHMENT_BATCH_OVERLAP:-1}
  MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
  MULTIMODAL_PAGE_MODEL: ${MULTIMODAL_PAGE_MODEL:-mistral-small-latest}
  MULTIMODAL_PAGE_DPI: ${MULTIMODAL_PAGE_DPI:-200}
  MULTIMODAL_PAGE_MAX_TOKENS: ${MULTIMODAL_PAGE_MAX_TOKENS:-6000}
  VISION_MODEL: ${VISION_MODEL:-pixtral-12b-2409}
  VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-1500}
  VISION_MAX_IMAGES_PER_DOCUMENT: ${VISION_MAX_IMAGES_PER_DOCUMENT:-}
  # Extraction vision par page (indexation documentaire)
  PAGE_EXTRACTION_MODEL: ${PAGE_EXTRACTION_MODEL:-mistral-small-latest}
  PAGE_EXTRACTION_MAX_CHUNK_TOKENS: ${PAGE_EXTRACTION_MAX_CHUNK_TOKENS:-480}
  PAGE_EXTRACTION_MAX_CHUNKS_PER_PAGE: ${PAGE_EXTRACTION_MAX_CHUNKS_PER_PAGE:-12}
  PAGE_EXTRACTION_DPI: ${PAGE_EXTRACTION_DPI:-200}
  PAGE_EXTRACTION_CONCURRENCY: ${PAGE_EXTRACTION_CONCURRENCY:-3}
  PAGE_EXTRACTION_TIMEOUT: ${PAGE_EXTRACTION_TIMEOUT:-120}
  PAGE_EXTRACTION_MAX_TOKENS: ${PAGE_EXTRACTION_MAX_TOKENS:-4096}
  DOCLING_OCR_ENABLED: ${DOCLING_OCR_ENABLED:-true}
  DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-fr,en}
  DOCLING_CPU_ONLY: ${DOCLING_CPU_ONLY:-true}
  DOCLING_USE_GPU: ${DOCLING_USE_GPU:-false}
  OCR_IMAGE_SCALE: ${OCR_IMAGE_SCALE:-3.0}
  OCR_PREPROCESS_ENABLED: ${OCR_PREPROCESS_ENABLED:-true}
  OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-true}
  OCR_MIN_TEXT_LENGTH: ${OCR_MIN_TEXT_LENGTH:-50}
  OCR_TESSERACT_CONFIG: ${OCR_TESSERACT_CONFIG:-}
  RRF_DYNAMIC_K_ENABLED: ${RRF_DYNAMIC_K_ENABLED:-true}
  RRF_MIN_K: ${RRF_MIN_K:-1}
  RRF_MAX_K: ${RRF_MAX_K:-10}
  RRF_RELATIVE_THRESHOLD_FACTOR: ${RRF_RELATIVE_THRESHOLD_FACTOR:-0.70}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-noton-rag}
  QUERY_UNDERSTANDING_ENABLED: ${QUERY_UNDERSTANDING_ENABLED:-false}
  # Reranker cross-encoder (CPU-only)
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RERANK_POOL: ${RERANK_POOL:-40}
  RERANK_CHAR_CAP: ${RERANK_CHAR_CAP:-8000}
  RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
  EARLY_STOP_TOP_N: ${EARLY_STOP_TOP_N:-5}
  EARLY_STOP_MEAN_THRESHOLD: ${EARLY_STOP_MEAN_THRESHOLD:-0.78}
  MIN_DYNAMIC_K: ${MIN_DYNAMIC_K:-2}
  MAX_DYNAMIC_K: ${MAX_DYNAMIC_K:-12}
  SOFTMAX_CUM_THRESHOLD: ${SOFTMAX_CUM_THRESHOLD:-0.80}
  STUTTER_GAP: ${STUTTER_GAP:-0.05}
  ZSCORE_FLAT_THRESHOLD: ${ZSCORE_FLAT_THRESHOLD:-0.05}
  # MMR (diversification)
  MMR_ENABLED: ${MMR_ENABLED:-true}
  MMR_K: ${MMR_K:-12}
  MMR_LAMBDA: ${MMR_LAMBDA:-0.7}
  MMR_MAX_PER_PARENT: ${MMR_MAX_PER_PARENT:-5}
  HF_TOKEN: ${HF_TOKEN:-}
  # Fiche technique (lookup par référence nue → sortie structurée sourcée)
  # Motifs de référence non exposés ici (défauts Python) : un ${VAR:-} vide écraserait
  # le regex par défaut. Les surcharger via .env si besoin.
  FICHE_TECHNIQUE_ENABLED: ${FICHE_TECHNIQUE_ENABLED:-true}
  FICHE_TECHNIQUE_K: ${FICHE_TECHNIQUE_K:-12}
  FICHE_MAX_WORDS: ${FICHE_MAX_WORDS:-10}
  FICHE_MAX_TOKENS: ${FICHE_MAX_TOKENS:-3000}
  # Moteur d'aiguillage procédural (guidage SAV / chantier)
  GUIDED_FLOW_ENABLED: ${GUIDED_FLOW_ENABLED:-false}
  GUIDED_MAX_STEPS: ${GUIDED_MAX_STEPS:-8}
  GUIDED_RETRIEVAL_K: ${GUIDED_RETRIEVAL_K:-8}
  GUIDED_AUTHORED_TREES_ENABLED: ${GUIDED_AUTHORED_TREES_ENABLED:-true}
  GUIDED_CATEGORY_FILTER_STRICT: ${GUIDED_CATEGORY_FILTER_STRICT:-false}
  GUIDED_MIN_CHOICES: ${GUIDED_MIN_CHOICES:-2}
  GUIDED_MAX_CHOICES: ${GUIDED_MAX_CHOICES:-5}
  GUIDED_SAV_CONTACT: ${GUIDED_SAV_CONTACT:-Service SAV PROFERM — contactez votre interlocuteur habituel.}

x-app-volumes: &app-volumes
  - ./app:/app/app
  - ./app/alembic:/app/alembic
  - ./app/alembic.ini:/app/alembic.ini
  - ./media:/app/media
  - ./logs:/app/logs
  # Tests : montés pour pouvoir lancer pytest dans le conteneur
  - ./tests:/app/tests
  - ./app/pytest.ini:/app/pytest.ini
  - hf_cache:/root/.cache/huggingface
  - ./data:/app/data

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: noton_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noton_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_web
    command: sh -c "sleep 5 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level info --access-log"
    volumes: *app-volumes
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-thread}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_worker
    command: sh -c "sleep 10 && celery -A app.celery_app worker -l INFO -Q documents,embeddings,celery -c $${CELERY_WORKER_CONCURRENCY:-1}"
    volumes: *app-volumes
    env_file:
      - .env
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
  hf_cache:
