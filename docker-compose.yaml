# Stack LIA : PostgreSQL + web (FastAPI). Le wiki (wiki_llm/) est monté en lecture seule.
# Source de vérité des valeurs : app/config.py (défauts) surchargés par .env.
x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  APP_NAME: ${APP_NAME:-LIA}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  # Mistral
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
  MODEL_FAST: ${MODEL_FAST:-mistral-small-latest}
  # Le chat CAG : le wiki entier dans le prompt, raisonnement, température basse.
  GENERATION_REASONING_EFFORT: ${GENERATION_REASONING_EFFORT:-high}
  CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.2}
  CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-4096}
  CHAT_HISTORY_MAX_MESSAGES: ${CHAT_HISTORY_MAX_MESSAGES:-10}
  CHAT_HISTORY_MAX_CHARS: ${CHAT_HISTORY_MAX_CHARS:-24000}
  # Le wiki : wiki/ (les pages) et raw/ (les PDF, hors git, copiés sur le serveur).
  WIKI_DIR: /app/wiki_llm

services:
  db:
    # Image pgvector conservée pour ne pas toucher au volume existant ; l'extension
    # vector est retirée par la migration wiki_refonte_drop_retrieval.
    image: pgvector/pgvector:pg15
    container_name: noton_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_web
    # --reload est un drapeau de DÉVELOPPEMENT (UVICORN_EXTRA_ARGS=--reload dans le .env
    # local) : il interrompt les flux SSE en cours dès qu'un fichier bouge.
    command: sh -c "sleep 3 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 ${UVICORN_EXTRA_ARGS:-} --log-level info --access-log"
    volumes:
      - ./app:/app/app
      - ./app/alembic:/app/alembic
      - ./app/alembic.ini:/app/alembic.ini
      - ./logs:/app/logs
      - ./wiki_llm:/app/wiki_llm:ro
      # Tests : montés pour pouvoir lancer pytest dans le conteneur
      - ./tests:/app/tests
      - ./app/pytest.ini:/app/pytest.ini
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
