services:
    db:
        image: pgvector/pgvector:pg15
        container_name: noton_db
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-noton}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        ports:
            - "5435:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: noton_redis
        ports:
            - "6379:6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    ollama:
        image: ollama/ollama:latest
        container_name: noton_ollama
        volumes:
            - ollama_data:/root/.ollama

    web:
        build:
            context: .
            dockerfile: ./app/Dockerfile
        container_name: noton_web
        command: sh -c "sleep 5 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
        volumes:
            # Monter le code dans /app/app pour que les imports "from app.xxx" fonctionnent
            - ./app:/app/app
            - ./app/alembic:/app/alembic
            - ./app/alembic.ini:/app/alembic.ini
            # Tests pytest
            - ./tests:/app/tests
            - ./app/pytest.ini:/app/pytest.ini
            # Cache persistant pour les modèles ML (évite re-téléchargement à chaque rebuild)
            - models_cache:/root/.cache
            # Images extraites par Docling (multimodal) - montées localement pour accès externe
            - ./media:/app/media
            # Journal dédié pipeline bibliothèque/espaces (library_document_processing.log)
            - ./logs:/app/logs

        ports:
            - "8001:8000"
        environment:
            - APP_NAME=${APP_NAME}
            - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-noton}}
            - SECRET_KEY=${SECRET_KEY}
            - MISTRAL_API_KEY=${MISTRAL_API_KEY}
            - MISTRAL_BASE_URL=${MISTRAL_BASE_URL:-https://api.mistral.ai}
            - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
            - OPENAI_API_KEY=${OPENAI_API_KEY}
            - OPENAI_MODEL=${OPENAI_MODEL}
            - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
            - MODEL_FAST=${MODEL_FAST:-mistral-small-latest}
            - MAX_COMPLETION_TOKENS=${MAX_COMPLETION_TOKENS:-1024}
            - SPACE_CHAT_MAX_TOKENS=${SPACE_CHAT_MAX_TOKENS:-}
            - SPACE_CHAT_TEMPERATURE=${SPACE_CHAT_TEMPERATURE:-0.55}
            - SPACE_CHAT_TOP_P=${SPACE_CHAT_TOP_P:-}
            # Optimisations CPU pour Docling/EasyOCR
            - DOCLING_CPU_ONLY=${DOCLING_CPU_ONLY:-true}
            - DOCLING_OCR_ENABLED=${DOCLING_OCR_ENABLED:-true}
            - DOCLING_OCR_LANG=${DOCLING_OCR_LANG:-}
            - USE_ALL_CPU_CORES=${USE_ALL_CPU_CORES:-false}
            - TORCH_NUM_THREADS=${TORCH_NUM_THREADS:-}
            - OMP_NUM_THREADS=${OMP_NUM_THREADS:-}
            # Paramètres OCR avancés
            - OCR_IMAGE_SCALE=${OCR_IMAGE_SCALE:-3.0}
            - OCR_PREPROCESS_ENABLED=${OCR_PREPROCESS_ENABLED:-true}
            - OCR_FALLBACK_ENABLED=${OCR_FALLBACK_ENABLED:-true}
            - OCR_MIN_TEXT_LENGTH=${OCR_MIN_TEXT_LENGTH:-50}
            - OCR_TESSERACT_CONFIG=${OCR_TESSERACT_CONFIG:---oem 3 --psm 6 -l fra+eng}
            - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-16}
            - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1024}
            - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-m3}
            - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
            - HIERARCHICAL_CHUNK_SIZES=${HIERARCHICAL_CHUNK_SIZES:-3072,1024,384}
            - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
            # KAG - Knowledge Augmented Generation
            - RAG_TOP_K=${RAG_TOP_K}
            - SPACE_MULTI_HOP_ENABLED=${SPACE_MULTI_HOP_ENABLED:-false}
            - SPACE_USE_CQR=${SPACE_USE_CQR:-false}
            - SPACE_EMPTY_ON_NO_MATCH=${SPACE_EMPTY_ON_NO_MATCH:-true}
            - SPACE_KAG_ILIKE_FALLBACK=${SPACE_KAG_ILIKE_FALLBACK:-false}
            - SPACE_SMALL_SPACE_MAX_DOCS=${SPACE_SMALL_SPACE_MAX_DOCS:-3}
            - SPACE_SMALL_SPACE_MAX_CHUNKS=${SPACE_SMALL_SPACE_MAX_CHUNKS:-50}
            - SPACE_KAG_GRAPH_ENABLED=${SPACE_KAG_GRAPH_ENABLED:-true}
            - SPACE_QUERY_REWRITE_ENABLED=${SPACE_QUERY_REWRITE_ENABLED:-true}
            - SPACE_QUERY_DECOMPOSE_ENABLED=${SPACE_QUERY_DECOMPOSE_ENABLED:-true}
            - SPACE_PAGE_SUMMARY_ENABLED=${SPACE_PAGE_SUMMARY_ENABLED:-true}
            - SPACE_PAGE_SUMMARY_PER_PAGE_LEAVES=${SPACE_PAGE_SUMMARY_PER_PAGE_LEAVES:-2}
            - SPACE_MAX_CONTEXT_LEAVES_PER_PAGE=${SPACE_MAX_CONTEXT_LEAVES_PER_PAGE:-2}
            - RRF_PAGE_LIST_WEIGHT=${RRF_PAGE_LIST_WEIGHT:-0.65}
            - PARENT_ENRICHED_MIN_SIMILARITY=${PARENT_ENRICHED_MIN_SIMILARITY:-0.78}
            - PARENT_ENRICHED_MAX_LEAVES_PER_PARENT=${PARENT_ENRICHED_MAX_LEAVES_PER_PARENT:-2}
            - SPACE_FAQ_LAYER_ENABLED=${SPACE_FAQ_LAYER_ENABLED:-true}
            - SPACE_FAQ_BASE_DIR=${SPACE_FAQ_BASE_DIR:-docs/faq_spaces}
            - SPACE_RETRIEVAL_CACHE_TTL_SECONDS=${SPACE_RETRIEVAL_CACHE_TTL_SECONDS:-90}
            - SPACE_RETRIEVAL_CACHE_MAX_ITEMS=${SPACE_RETRIEVAL_CACHE_MAX_ITEMS:-256}
            - KAG_ENABLED=${KAG_ENABLED:-true}
            - KAG_EXTRACTION_PROVIDER=${KAG_EXTRACTION_PROVIDER}
            - KAG_EXTRACTION_MODEL=${KAG_EXTRACTION_MODEL}
            - KAG_PARENT_ENRICHMENT_ENABLED=${KAG_PARENT_ENRICHMENT_ENABLED:-true}
            # Relations entité-entité typées (LLM) + filtre retrieval par confiance calibrée
            - KAG_TYPED_RELATIONS_ENABLED=${KAG_TYPED_RELATIONS_ENABLED:-true}
            - MIN_ENTITY_CONFIDENCE=${MIN_ENTITY_CONFIDENCE:-0.30}
            - MULTIMODAL_ENABLED=${MULTIMODAL_ENABLED:-true}
            - VISION_MODEL=${VISION_MODEL:-pixtral-12b-2409}
            - VISION_MAX_TOKENS=${VISION_MAX_TOKENS:-1500}
            - VISION_MAX_IMAGES_PER_DOCUMENT=${VISION_MAX_IMAGES_PER_DOCUMENT:-}
            # Redis + Celery (tâches background hors process web)
            - REDIS_URL=${REDIS_URL}
            - CELERY_BROKER_URL=${CELERY_BROKER_URL}
            - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
            - TASK_BACKEND_MODE=${TASK_BACKEND_MODE}
            # LangSmith observabilité
            - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
            - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-}
            - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
            - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-noton-rag-kag}
            - TRACE_VERBOSE_TEXT=${TRACE_VERBOSE_TEXT:-false}
            - TRACE_TEXT_MAX_CHARS=${TRACE_TEXT_MAX_CHARS:-12000}
            # Reranking Performance
            - RERANKER_MODEL=${RERANKER_MODEL:-BAAI/bge-reranker-base}
            - RERANK_STAGE1_MAX=${RERANK_STAGE1_MAX:-40}
            - RERANK_STAGE2_POOL=${RERANK_STAGE2_POOL:-15}
            - MAX_RERANK_CANDIDATES=${MAX_RERANK_CANDIDATES:-40}
            - MMR_K=${MMR_K:-15}
            - RERANKER_TOP_N=${RERANKER_TOP_N:-60}
            - RERANKER_ENABLED=${RERANKER_ENABLED:-false}
            # Plan C (agentic léger)
            - SPACE_AGENTIC_STEPBACK_ENABLED=${SPACE_AGENTIC_STEPBACK_ENABLED:-true}
            - SPACE_AGENTIC_MIN_SCORE=${SPACE_AGENTIC_MIN_SCORE:-0.12}
            - SPACE_AGENTIC_MIN_CITED_PASSAGES=${SPACE_AGENTIC_MIN_CITED_PASSAGES:-2}
            - SPACE_AGENTIC_MAX_TURNS=${SPACE_AGENTIC_MAX_TURNS:-2}
            - SPACE_AGENTIC_DECOMPOSE_MAX_SUBQS=${SPACE_AGENTIC_DECOMPOSE_MAX_SUBQS:-3}
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            ollama:
                condition: service_started

    worker:
        build:
            context: .
            dockerfile: ./app/Dockerfile
        container_name: noton_worker
        command: sh -c "sleep 10 && celery -A app.celery_app worker -l INFO -Q documents,embeddings,celery -c 1"
        volumes:
            - ./app:/app/app
            - ./app/alembic:/app/alembic
            - ./app/alembic.ini:/app/alembic.ini
            - ./tests:/app/tests
            - ./app/pytest.ini:/app/pytest.ini
            - models_cache:/root/.cache
