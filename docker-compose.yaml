# Stack Noton : Mistral OCR + LlamaIndex + pgvector + reranker MiniLM + MMR
x-app-env: &app-env
  PYTHONUNBUFFERED: "1"
  APP_NAME: ${APP_NAME}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
  MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
  MISTRAL_OCR_TIMEOUT: ${MISTRAL_OCR_TIMEOUT:-300}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  MODEL_FAST: ${MODEL_FAST:-mistral-small-latest}
  MAX_COMPLETION_TOKENS: ${MAX_COMPLETION_TOKENS:-1024}
  SPACE_CHAT_MAX_TOKENS: ${SPACE_CHAT_MAX_TOKENS:-}
  SPACE_CHAT_TEMPERATURE: ${SPACE_CHAT_TEMPERATURE:-0.55}
  SPACE_CHAT_TOP_P: ${SPACE_CHAT_TOP_P:-}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mistral-embed}
  HIERARCHICAL_CHUNK_SIZES: ${HIERARCHICAL_CHUNK_SIZES:-1024,256}
  USE_MARKDOWN_STRUCTURED_CHUNKING: ${USE_MARKDOWN_STRUCTURED_CHUNKING:-false}
  PDF_FORCE_OCR: ${PDF_FORCE_OCR:-false}
  MARKDOWN_STRUCTURED_PARENT_DEPTH: ${MARKDOWN_STRUCTURED_PARENT_DEPTH:-1}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  RAG_TOP_K: ${RAG_TOP_K:-8}
  MIN_VECTOR_SIMILARITY: ${MIN_VECTOR_SIMILARITY:-0.25}
  FAQ_TOP_K: ${FAQ_TOP_K:-3}
  FAQ_MIN_SIMILARITY: ${FAQ_MIN_SIMILARITY:-0.30}
  FAQ_POST_DRAFT_ENABLED: ${FAQ_POST_DRAFT_ENABLED:-true}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-celery}
  KAG_ENABLED: ${KAG_ENABLED:-false}
  KAG_EXTRACTION_PROVIDER: ${KAG_EXTRACTION_PROVIDER:-mistral}
  KAG_EXTRACTION_MODEL: ${KAG_EXTRACTION_MODEL:-ministral-3b-latest}
  MULTIMODAL_ENABLED: ${MULTIMODAL_ENABLED:-false}
  VISION_MODEL: ${VISION_MODEL:-pixtral-12b-2409}
  VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-1500}
  VISION_MAX_IMAGES_PER_DOCUMENT: ${VISION_MAX_IMAGES_PER_DOCUMENT:-}
  DOCLING_OCR_ENABLED: ${DOCLING_OCR_ENABLED:-true}
  DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-fr,en}
  DOCLING_CPU_ONLY: ${DOCLING_CPU_ONLY:-true}
  DOCLING_USE_GPU: ${DOCLING_USE_GPU:-false}
  OCR_IMAGE_SCALE: ${OCR_IMAGE_SCALE:-3.0}
  OCR_PREPROCESS_ENABLED: ${OCR_PREPROCESS_ENABLED:-true}
  OCR_FALLBACK_ENABLED: ${OCR_FALLBACK_ENABLED:-true}
  OCR_MIN_TEXT_LENGTH: ${OCR_MIN_TEXT_LENGTH:-50}
  OCR_TESSERACT_CONFIG: ${OCR_TESSERACT_CONFIG:-}
  RRF_DYNAMIC_K_ENABLED: ${RRF_DYNAMIC_K_ENABLED:-true}
  RRF_MIN_K: ${RRF_MIN_K:-1}
  RRF_MAX_K: ${RRF_MAX_K:-10}
  RRF_RELATIVE_THRESHOLD_FACTOR: ${RRF_RELATIVE_THRESHOLD_FACTOR:-0.70}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-noton-rag}
  # Reranker cross-encoder (CPU-only)
  RERANKER_ENABLED: ${RERANKER_ENABLED:-false}
  RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
  RERANK_POOL: ${RERANK_POOL:-40}
  RERANK_CHAR_CAP: ${RERANK_CHAR_CAP:-8000}
  RERANK_BATCH_SIZE: ${RERANK_BATCH_SIZE:-16}
  EARLY_STOP_TOP_N: ${EARLY_STOP_TOP_N:-5}
  EARLY_STOP_MEAN_THRESHOLD: ${EARLY_STOP_MEAN_THRESHOLD:-0.78}
  MIN_DYNAMIC_K: ${MIN_DYNAMIC_K:-2}
  MAX_DYNAMIC_K: ${MAX_DYNAMIC_K:-12}
  SOFTMAX_CUM_THRESHOLD: ${SOFTMAX_CUM_THRESHOLD:-0.80}
  STUTTER_GAP: ${STUTTER_GAP:-0.05}
  ZSCORE_FLAT_THRESHOLD: ${ZSCORE_FLAT_THRESHOLD:-0.05}
  # MMR (diversification)
  MMR_ENABLED: ${MMR_ENABLED:-true}
  MMR_K: ${MMR_K:-12}
  MMR_LAMBDA: ${MMR_LAMBDA:-0.7}
  MMR_MAX_PER_PARENT: ${MMR_MAX_PER_PARENT:-5}

x-app-volumes: &app-volumes
  - ./app:/app/app
  - ./app/alembic:/app/alembic
  - ./app/alembic.ini:/app/alembic.ini
  - ./media:/app/media
  - ./logs:/app/logs

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: noton_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noton_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optionnel : LLM local (non requis pour OCR / embeddings / chat Mistral)
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: noton_ollama
    volumes:
      - ollama_data:/root/.ollama

  web:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_web
    command: sh -c "sleep 5 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: *app-volumes
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-thread}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_worker
    command: sh -c "sleep 10 && celery -A app.celery_app worker -l INFO -Q documents,embeddings,celery -c 1"
    volumes: *app-volumes
    env_file:
      - .env
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
