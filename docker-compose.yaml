# Stack Noton : Mistral OCR + LlamaIndex + pgvector (sans Docling / KAG / reranker)
x-app-env: &app-env
  APP_NAME: ${APP_NAME}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY}
  MISTRAL_API_KEY: ${MISTRAL_API_KEY}
  MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai}
  MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-latest}
  MISTRAL_OCR_TIMEOUT: ${MISTRAL_OCR_TIMEOUT:-300}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
  MODEL_FAST: ${MODEL_FAST:-mistral-small-latest}
  MAX_COMPLETION_TOKENS: ${MAX_COMPLETION_TOKENS:-1024}
  SPACE_CHAT_MAX_TOKENS: ${SPACE_CHAT_MAX_TOKENS:-}
  SPACE_CHAT_TEMPERATURE: ${SPACE_CHAT_TEMPERATURE:-0.55}
  SPACE_CHAT_TOP_P: ${SPACE_CHAT_TOP_P:-}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mistral-embed}
  HIERARCHICAL_CHUNK_SIZES: ${HIERARCHICAL_CHUNK_SIZES:-1024,256}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  RAG_TOP_K: ${RAG_TOP_K:-8}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
  TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-celery}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
  LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-noton-rag}

x-app-volumes: &app-volumes
  - ./app:/app/app
  - ./app/alembic:/app/alembic
  - ./app/alembic.ini:/app/alembic.ini
  - ./media:/app/media
  - ./logs:/app/logs

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: noton_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: noton_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Optionnel : LLM local (non requis pour OCR / embeddings / chat Mistral)
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: noton_ollama
    volumes:
      - ollama_data:/root/.ollama

  web:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_web
    command: sh -c "sleep 5 && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: *app-volumes
    ports:
      - "8001:8000"
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: ${TASK_BACKEND_MODE:-thread}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: noton_worker
    command: sh -c "sleep 10 && celery -A app.celery_app worker -l INFO -Q documents,embeddings,celery -c 1"
    volumes: *app-volumes
    environment:
      <<: *app-env
      TASK_BACKEND_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
