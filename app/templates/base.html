<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}{{ app_name }}{% endblock %}</title>
        
        <!-- Outfit font from Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ["Outfit", "sans-serif"],
                        },
                    },
                },
            };
        </script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
        />
        <style>
            [x-cloak] {
                display: none !important;
            }
            
            /* Glassmorphism Styles */
            .glass-panel {
                background: rgba(255, 255, 255, 0.45);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.04);
            }
            .dark .glass-panel {
                background: rgba(30, 37, 56, 0.55);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25);
            }
            .glass-card {
                background: rgba(255, 255, 255, 0.5);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.4);
                box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.03);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .dark .glass-card {
                background: rgba(38, 47, 71, 0.55);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.15);
            }
            .glass-card:hover {
                transform: translateY(-2px) scale(1.01);
                background: rgba(255, 255, 255, 0.65);
                border-color: rgba(99, 102, 241, 0.4);
                box-shadow: 0 10px 24px 0 rgba(99, 102, 241, 0.1);
            }
            .dark .glass-card:hover {
                background: rgba(25, 32, 49, 0.6);
                border-color: rgba(99, 102, 241, 0.3);
                box-shadow: 0 10px 24px 0 rgba(99, 102, 241, 0.2);
            }
            .glass-input {
                background: rgba(255, 255, 255, 0.5);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(0, 0, 0, 0.1);
                transition: all 0.2s ease-in-out;
            }
            .dark .glass-input {
                background: rgba(30, 37, 56, 0.7);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.12);
            }
            .glass-input:focus {
                outline: none;
                background: rgba(255, 255, 255, 0.8);
                border-color: #4f46e5;
                box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            }
            .dark .glass-input:focus {
                background: rgba(20, 26, 40, 0.85);
                border-color: #6366f1;
                box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            }
            .glass-btn {
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .glass-btn:active {
                transform: scale(0.95);
            }

            /* Animated Mesh Background */
            @keyframes blob {
                0% { transform: translate(0px, 0px) scale(1); }
                33% { transform: translate(30px, -50px) scale(1.1); }
                66% { transform: translate(-20px, 20px) scale(0.9); }
                100% { transform: translate(0px, 0px) scale(1); }
            }
            .animate-blob {
                animation: blob 20s infinite ease-in-out;
            }
            .animation-delay-2000 {
                animation-delay: 4s;
            }
            .animation-delay-4000 {
                animation-delay: 8s;
            }

            /* Sidebar style modern Apple */
            #sidebar nav a {
                border-radius: 0.75rem;
                transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #sidebar nav a:hover {
                background: rgba(79, 70, 229, 0.08);
                color: #4f46e5 !important;
            }
            .dark #sidebar nav a:hover {
                background: rgba(99, 102, 241, 0.15);
                color: #818cf8 !important;
            }
            #sidebar nav a.active {
                background: linear-gradient(135deg, #4f46e5, #6366f1);
                color: white !important;
                box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            }
            .dark #sidebar nav a.active {
                background: linear-gradient(135deg, #6366f1, #818cf8);
                box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            }
            #sidebar nav a, 
            #sidebar nav a:hover,
            #spaces-list a,
            #spaces-list a:hover {
                text-decoration: none !important;
            }
            #sidebar .text-xs.uppercase {
                letter-spacing: 0.08em;
            }
            /* Fix: ensure the flex chain has a proper height root */
            html, body { height: 100%; }

            /* ===== MOBILE PERFORMANCE ===== */
            /* On small screens: kill expensive GPU effects */
            @media (max-width: 1023px) {
                /* Stop blob animations — not visible behind panels anyway */
                .animate-blob {
                    animation: none !important;
                }
                /* Reduce backdrop blur — biggest GPU drain on mobile */
                .glass-panel {
                    backdrop-filter: blur(8px);
                    -webkit-backdrop-filter: blur(8px);
                    background: rgba(255, 255, 255, 0.82);
                }
                .dark .glass-panel {
                    backdrop-filter: blur(8px);
                    -webkit-backdrop-filter: blur(8px);
                    background: rgba(30, 37, 56, 0.92);
                }
                .glass-card {
                    backdrop-filter: none;
                    -webkit-backdrop-filter: none;
                    background: rgba(255, 255, 255, 0.85);
                }
                .dark .glass-card {
                    backdrop-filter: none;
                    -webkit-backdrop-filter: none;
                    background: rgba(38, 47, 71, 0.92);
                }
                .glass-input {
                    backdrop-filter: none;
                    -webkit-backdrop-filter: none;
                    background: rgba(255, 255, 255, 0.9);
                }
                .dark .glass-input {
                    backdrop-filter: none;
                    -webkit-backdrop-filter: none;
                    background: rgba(30, 37, 56, 0.95);
                }
                /* Disable hover transforms on touch (no hover on mobile anyway) */
                .glass-card:hover {
                    transform: none;
                }
                /* Shorten transitions */
                .glass-card, #sidebar nav a {
                    transition-duration: 0.1s;
                }
            }

            /* ===== HIGH CONTRAST & READABLE MODALS (Light/Dark) ===== */
            /* 1. Darker & more blurred overlay for better focus */
            div[id*="modal"], div[id$="-modal"], div[class*="modal"] {
                background-color: rgba(0, 0, 0, 0.65) !important;
                backdrop-filter: blur(12px) !important;
                -webkit-backdrop-filter: blur(12px) !important;
            }
            /* 2. Make modal dialogs solid and clear */
            div[id*="modal"] .glass-panel, div[id$="-modal"] .glass-panel, div[class*="modal"] .glass-panel {
                background: #ffffff !important;
                border: 1px solid rgba(0, 0, 0, 0.15) !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
            }
            .dark div[id*="modal"] .glass-panel, .dark div[id$="-modal"] .glass-panel, .dark div[class*="modal"] .glass-panel {
                background: #232a3f !important;
                border: 1px solid rgba(255, 255, 255, 0.15) !important;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6) !important;
            }
            /* 3. High contrast text colors for modal headers and body text */
            div[id*="modal"] h3, div[id$="-modal"] h3, div[class*="modal"] h3 {
                color: #111827 !important; /* text-gray-900 */
            }
            .dark div[id*="modal"] h3, .dark div[id$="-modal"] h3, .dark div[class*="modal"] h3 {
                color: #f9fafb !important; /* text-gray-50 */
            }
            div[id*="modal"] label, div[id$="-modal"] label, div[class*="modal"] label {
                color: #374151 !important; /* text-gray-700 */
            }
            .dark div[id*="modal"] label, .dark div[id$="-modal"] label, .dark div[class*="modal"] label {
                color: #d1d5db !important; /* text-gray-300 */
            }
            /* 4. Sharp, highly visible inputs inside modals */
            div[id*="modal"] .glass-input, div[id$="-modal"] .glass-input, div[class*="modal"] .glass-input {
                background: #f3f4f6 !important; /* text-gray-100 */
                border: 1px solid #d1d5db !important; /* border-gray-300 */
                color: #111827 !important;
            }
            .dark div[id*="modal"] .glass-input, .dark div[id$="-modal"] .glass-input, .dark div[class*="modal"] .glass-input {
                background: #1e2438 !important;
                border: 1px solid #374151 !important; /* border-gray-700 */
                color: #ffffff !important;
            }
            /* 5. Clear, readable placeholders */
            div[id*="modal"] .glass-input::placeholder, div[id$="-modal"] .glass-input::placeholder, div[class*="modal"] .glass-input::placeholder {
                color: #6b7280 !important; /* gray-500 */
            }
            .dark div[id*="modal"] .glass-input::placeholder, .dark div[id$="-modal"] .glass-input::placeholder, .dark div[class*="modal"] .glass-input::placeholder {
                color: #9ca3af !important; /* gray-400 */
            }
            /* Focus states */
            div[id*="modal"] .glass-input:focus, div[id$="-modal"] .glass-input:focus, div[class*="modal"] .glass-input:focus {
                border-color: #4f46e5 !important;
                background: #ffffff !important;
            }
            .dark div[id*="modal"] .glass-input:focus, .dark div[id$="-modal"] .glass-input:focus, .dark div[class*="modal"] .glass-input:focus {
                border-color: #6366f1 !important;
                background: #191e2e !important;
            }

            /* LIA loading/thinking animation: Idle (up/down) -> 360deg Rotation -> Idle */
            @keyframes lia-loading {
                0% { transform: translateY(0) rotate(0deg); }
                15% { transform: translateY(-6px) rotate(0deg); }
                30% { transform: translateY(0) rotate(0deg); }
                45% { transform: translateY(-3px) rotate(0deg); }
                55% { transform: translateY(0) rotate(0deg); }
                70% { transform: translateY(0) rotate(180deg); }
                80% { transform: translateY(0) rotate(360deg); }
                100% { transform: translateY(0) rotate(360deg); }
            }
            .lia-loading-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                animation: lia-loading 3.5s cubic-bezier(0.45, 0, 0.55, 1) infinite;
                will-change: transform;
            }
            .assistant-message-bubble {
                background: #f1f5f9 !important;
                border: 1px solid #e2e8f0 !important;
            }
            .dark .assistant-message-bubble {
                background: #232a3f !important;
                border: 1px solid rgba(255, 255, 255, 0.08) !important;
            }
        </style>
        {% block extra_head %}{% endblock %}
    </head>
    <body class="bg-[#f2f4f8] dark:bg-[#1a1e2d] text-gray-800 dark:text-gray-100 transition-colors duration-300 font-sans antialiased">
        <!-- Animated Mesh Background (desktop only for performance) -->
        <div class="fixed inset-0 overflow-hidden pointer-events-none z-[-1]">
            <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-tr from-blue-300/30 to-indigo-400/20 dark:from-blue-900/10 dark:to-indigo-900/10 sm:blur-[100px] animate-blob hidden sm:block"></div>
            <div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-gradient-to-tr from-purple-300/30 to-pink-400/20 dark:from-purple-900/10 dark:to-pink-900/10 sm:blur-[100px] animate-blob animation-delay-2000 hidden sm:block"></div>
        </div>

        <!-- Outer Flex Container -->
        <div class="flex h-dvh min-h-0 relative p-2 lg:p-3 gap-2 lg:gap-3 overflow-hidden">
            <!-- Mobile Menu Overlay -->
            <div
                id="mobile-menu-overlay"
                class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden"
                onclick="toggleMobileMenu()"
            ></div>

            <!-- Sidebar -->
            <aside
                id="sidebar"
                class="fixed lg:relative inset-y-0 left-0 z-50 w-64 h-full glass-panel rounded-2xl flex flex-col transform -translate-x-full lg:translate-x-0 transition-all duration-300 ease-in-out shadow-lg"
            >
                <div
                    class="p-4 border-b border-black/5 dark:border-white/5 flex items-center justify-between"
                >
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-blue-600 via-indigo-500 to-purple-600 dark:from-blue-400 dark:via-indigo-400 dark:to-purple-400 bg-clip-text text-transparent"
                    >
                        {{ app_name }}
                    </h1>
                    <div class="flex items-center gap-1">
                        <button
                            onclick="toggleDarkMode()"
                            class="hidden lg:block text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
                            title="Basculer le thème"
                        >
                            <i
                                id="theme-icon-desktop"
                                class="ti ti-sun text-lg"
                            ></i>
                        </button>
                        <button
                            onclick="toggleMobileMenu()"
                            class="lg:hidden text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
                        >
                            <i class="ti ti-x text-lg"></i>
                        </button>
                    </div>
                </div>
                <nav class="flex-1 p-3 overflow-y-auto space-y-1">
                    <a
                        href="/"
                        class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors"
                    >
                        <i class="ti ti-home-2 text-lg"></i>
                        <span>Accueil</span>
                    </a>
                    <a
                        href="/library"
                        class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors"
                    >
                        <i class="ti ti-library text-lg"></i>
                        <span>Bibliothèque</span>
                    </a>
                    <a
                        href="/feedbacks"
                        class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors"
                    >
                        <i class="ti ti-message-check text-lg"></i>
                        <span>Mes retours</span>
                    </a>
                    <a
                        id="admin-link"
                        href="/admin"
                        class="hidden flex items-center gap-3 px-4 py-2.5 mt-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 transition-colors"
                    >
                        <i class="ti ti-settings text-lg"></i>
                        <span>Administration</span>
                    </a>

                    <div id="sidebar-secondary-section" class="mt-6 pt-4 border-t border-black/5 dark:border-white/5">
                        <div class="flex items-center justify-between px-3 py-1 mb-2">
                            <span
                                id="sidebar-secondary-title"
                                class="text-[10px] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider"
                                >ESPACES</span
                            >
                            <button
                                id="sidebar-secondary-action"
                                onclick="if (typeof openCreateSpaceModal === 'function') openCreateSpaceModal();"
                                class="text-gray-400 dark:text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 p-1 rounded-md hover:bg-black/5 dark:hover:bg-white/5 transition-all"
                                title="Nouvel espace"
                            >
                                <i class="ti ti-plus text-sm"></i>
                            </button>
                        </div>
                        <div id="spaces-list" class="space-y-1">
                            <!-- Espaces chargés dynamiquement -->
                        </div>
                    </div>
                </nav>
                <div class="p-3 border-t border-black/5 dark:border-white/5 bg-black/[0.02] dark:bg-white/[0.02] rounded-b-2xl">
                    <div class="flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5 min-w-0">
                            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-semibold text-sm shadow-sm shrink-0">
                                <span id="user-avatar-initial">U</span>
                            </div>
                            <span
                                id="current-user"
                                class="text-sm font-semibold text-gray-700 dark:text-gray-200 truncate"
                            ></span>
                        </div>
                        <button
                            onclick="logout()"
                            class="text-gray-400 dark:text-gray-500 hover:text-red-500 dark:hover:text-red-400 p-1.5 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
                            title="Déconnexion"
                        >
                            <i class="ti ti-logout text-lg"></i>
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="flex-1 flex flex-col min-h-0 overflow-hidden w-full lg:w-auto glass-panel rounded-2xl shadow-lg">
                <!-- Mobile Header -->
                <div
                    class="lg:hidden bg-white/20 dark:bg-black/20 border-b border-black/5 dark:border-white/5 px-4 py-3 flex items-center justify-between flex-shrink-0 backdrop-blur-md rounded-t-2xl"
                >
                    <button
                        onclick="toggleMobileMenu()"
                        class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
                    >
                        <i class="ti ti-menu-2 text-xl"></i>
                    </button>
                    <h1
                        class="text-lg font-bold bg-gradient-to-r from-blue-600 via-indigo-500 to-purple-600 dark:from-blue-400 dark:via-indigo-400 dark:to-purple-400 bg-clip-text text-transparent"
                    >
                        {{ app_name }}
                    </h1>
                    <button
                        onclick="toggleDarkMode()"
                        class="text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100 p-2 rounded-lg hover:bg-black/5 dark:hover:bg-white/5 transition-colors"
                        title="Basculer le thème"
                    >
                        <i id="theme-icon" class="ti ti-sun text-xl"></i>
                    </button>
                </div>
                {% block content %}{% endblock %}
            </main>
        </div>

        <!-- Modals -->
        <div
            id="create-project-modal"
            class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4"
        >
            <div
                class="bg-white dark:bg-gray-800 rounded-lg p-6 w-full max-w-md max-h-[90vh] overflow-y-auto"
            >
                <h2
                    class="text-xl font-bold mb-4 text-gray-900 dark:text-gray-100"
                >
                    Créer un nouveau projet
                </h2>
                <form id="create-project-form" onsubmit="createProject(event)">
                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
                            >Titre</label
                        >
                        <input
                            type="text"
                            name="title"
                            required
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Mon projet"
                        />
                    </div>
                    <div class="mb-4">
                        <label
                            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2"
                            >Description (optionnelle)</label
                        >
                        <textarea
                            name="description"
                            rows="3"
                            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            placeholder="Décrivez votre projet..."
                        ></textarea>
                    </div>
                    <div class="flex justify-end gap-2">
                        <button
                            type="button"
                            onclick="hideCreateProjectModal()"
                            class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-300"
                        >
                            Annuler
                        </button>
                        <button
                            type="submit"
                            class="px-4 py-2 bg-blue-600 dark:bg-blue-500 text-white rounded-lg hover:bg-blue-700 dark:hover:bg-blue-600"
                        >
                            Créer le projet
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            let currentUser = null;

            // Gérer le dark mode
            function initDarkMode() {
                const isDark =
                    localStorage.getItem("darkMode") === "true" ||
                    (!localStorage.getItem("darkMode") &&
                        window.matchMedia("(prefers-color-scheme: dark)")
                            .matches);
                if (isDark) {
                    document.documentElement.classList.add("dark");
                }
                updateThemeIcon();
            }

            function toggleDarkMode() {
                const isDark =
                    document.documentElement.classList.toggle("dark");
                localStorage.setItem("darkMode", isDark);
                updateThemeIcon();
            }

            function updateThemeIcon() {
                const icon = document.getElementById("theme-icon");
                const iconDesktop =
                    document.getElementById("theme-icon-desktop");
                const isDark =
                    document.documentElement.classList.contains("dark");
                if (icon) {
                    icon.className = isDark
                        ? "ti ti-moon text-xl"
                        : "ti ti-sun text-xl";
                }
                if (iconDesktop) {
                    iconDesktop.className = isDark
                        ? "ti ti-moon text-xl"
                        : "ti ti-sun text-xl";
                }
            }

            // Gérer le menu mobile
            function toggleMobileMenu() {
                const sidebar = document.getElementById("sidebar");
                const overlay = document.getElementById("mobile-menu-overlay");
                sidebar.classList.toggle("-translate-x-full");
                overlay.classList.toggle("hidden");
            }

            // Fermer le menu mobile lors du clic sur un lien
            document.addEventListener("DOMContentLoaded", function () {
                const sidebar = document.getElementById("sidebar");
                if (sidebar) {
                    sidebar.addEventListener("click", function (e) {
                        if (
                            e.target.tagName === "A" &&
                            window.innerWidth < 1024
                        ) {
                            setTimeout(toggleMobileMenu, 100);
                        }
                    });
                }
            });

            // Fonctions utilitaires
            async function apiCall(url, options = {}) {
                const headers = {
                    ...options.headers,
                };
                if (!headers["Content-Type"] && !(options.body instanceof FormData)) {
                    headers["Content-Type"] = "application/json";
                }
                const response = await fetch(url, {
                    ...options,
                    headers,
                    credentials: "include",
                });
                if (response.status === 401) {
                    console.error("401 Unauthorized for:", url);
                    window.location.href = "/login";
                    return null;
                }
                return response;
            }

            function showCreateProjectModal() {
                document
                    .getElementById("create-project-modal")
                    .classList.remove("hidden");
            }

            function hideCreateProjectModal() {
                document
                    .getElementById("create-project-modal")
                    .classList.add("hidden");
                document.getElementById("create-project-form").reset();
            }

            async function createProject(event) {
                event.preventDefault();
                const formData = new FormData(event.target);
                const data = {
                    title: formData.get("title"),
                    description: formData.get("description") || null,
                };
                const response = await apiCall("/api/projects", {
                    method: "POST",
                    body: JSON.stringify(data),
                });
                if (response && response.ok) {
                    hideCreateProjectModal();
                    loadProjects();
                    if (window.loadProjectsList) window.loadProjectsList();
                }
            }

            function escapeHtml(text) {
                const div = document.createElement("div");
                div.textContent = text;
                return div.innerHTML;
            }

            async function loadProjects() {
                const response = await apiCall("/api/projects");
                if (response && response.ok) {
                    const projects = await response.json();
                    const projectsList =
                        document.getElementById("projects-list");
                    if (projectsList) {
                        projectsList.innerHTML = projects
                            .map(
                                (p) => `
                        <div class="group flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors">
                            <a href="/projects/${
                                p.id
                            }" class="flex-1 text-gray-700 dark:text-gray-300 cursor-pointer" data-project-title="${escapeHtml(
                                    p.title
                                )}">
                                <span id="project-title-${p.id}">${escapeHtml(
                                    p.title
                                )}</span>
                            </a>
                            <button
                                onclick="editProjectName(event, ${p.id})"
                                class="opacity-0 group-hover:opacity-100 text-blue-500 hover:text-blue-700 dark:hover:text-blue-400 p-1 transition-opacity"
                                title="Renommer le projet"
                                data-project-title="${escapeHtml(p.title)}"
                            >
                                <i class="ti ti-pencil text-sm"></i>
                            </button>
                            <button
                                onclick="deleteProject(event, ${p.id})"
                                class="opacity-0 group-hover:opacity-100 text-red-500 hover:text-red-700 dark:hover:text-red-400 p-1 transition-opacity"
                                title="Supprimer le projet"
                                data-project-title="${escapeHtml(p.title)}"
                            >
                                <i class="ti ti-trash text-sm"></i>
                            </button>
                        </div>
                    `
                            )
                            .join("");
                    }
                }
            }

            async function deleteProject(event, projectId) {
                event.stopPropagation();
                const button = event.target.closest("button");
                const projectTitle = button
                    ? button.getAttribute("data-project-title")
                    : "ce projet";
                if (
                    !confirm(
                        `Êtes-vous sûr de vouloir supprimer le projet "${projectTitle}" ? Cette action est irréversible.`
                    )
                ) {
                    return;
                }
                const response = await apiCall(`/api/projects/${projectId}`, {
                    method: "DELETE",
                });
                if (response && response.ok) {
                    loadProjects();
                    if (window.loadProjectsList) window.loadProjectsList();
                    // Rediriger vers la page d'accueil si on était sur la page du projet supprimé
                    if (window.location.pathname === `/projects/${projectId}`) {
                        window.location.href = "/";
                    }
                } else {
                    alert("Erreur lors de la suppression du projet");
                }
            }

            function editProjectName(event, projectId) {
                event.preventDefault();
                event.stopPropagation();
                const button = event.target.closest("button");
                const currentTitle = button
                    ? button.getAttribute("data-project-title")
                    : "";

                const titleElement = document.getElementById(
                    `project-title-${projectId}`
                );
                if (!titleElement) return;

                const linkElement = titleElement.closest("a");
                if (!linkElement) return;

                // Sauvegarder le contenu original du lien
                const originalContent = linkElement.innerHTML;
                const originalHref = linkElement.getAttribute("href");

                // Créer un input pour l'édition
                const input = document.createElement("input");
                input.type = "text";
                input.value = currentTitle;
                input.className =
                    "w-full px-2 py-1 border border-blue-500 rounded bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500";
                input.style.minWidth = "150px";

                // Remplacer le contenu du lien par l'input
                linkElement.innerHTML = "";
                linkElement.appendChild(input);
                linkElement.style.pointerEvents = "none"; // Désactiver la navigation pendant l'édition
                input.focus();
                input.select();

                const saveEdit = async () => {
                    const newTitle = input.value.trim();
                    if (newTitle === currentTitle || newTitle === "") {
                        // Annuler si pas de changement ou vide
                        linkElement.innerHTML = originalContent;
                        linkElement.style.pointerEvents = "";
                        return;
                    }

                    const response = await apiCall(
                        `/api/projects/${projectId}`,
                        {
                            method: "PUT",
                            body: JSON.stringify({ title: newTitle }),
                        }
                    );

                    if (response && response.ok) {
                        loadProjects();
                        if (window.loadProjectsList) window.loadProjectsList();
                    } else {
                        alert("Erreur lors de la modification du projet");
                        linkElement.innerHTML = originalContent;
                        linkElement.style.pointerEvents = "";
                    }
                };

                const cancelEdit = () => {
                    linkElement.innerHTML = originalContent;
                    linkElement.style.pointerEvents = "";
                };

                input.addEventListener("blur", saveEdit);
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        e.preventDefault();
                        input.blur();
                    } else if (e.key === "Escape") {
                        e.preventDefault();
                        cancelEdit();
                    }
                });
            }

            async function logout() {
                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "include",
                });
                window.location.href = "/login";
            }

            async function loadCurrentUser() {
                const response = await apiCall("/api/auth/me");
                if (response && response.ok) {
                    currentUser = await response.json();
                    const userElement = document.getElementById("current-user");
                    if (userElement) {
                        userElement.textContent = currentUser.username;
                    }
                    const avatarEl = document.getElementById("user-avatar-initial");
                    if (avatarEl && currentUser.username) {
                        avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
                    }
                    
                    // Afficher le lien admin si l'utilisateur a la permission
                    if (currentUser.permissions && (
                        currentUser.permissions.includes('config.manage_users') ||
                        currentUser.permissions.includes('config.manage_roles')
                    )) {
                        const adminLink = document.getElementById('admin-link');
                        if (adminLink) {
                            adminLink.classList.remove('hidden');
                        }
                    }
                } else {
                    window.location.href = "/login";
                }
            }

            // Initialisation
            initDarkMode();
            loadCurrentUser();
        </script>
        {% block extra_scripts %}{% endblock %}
    </body>
</html>
